name: hermes-mobile
version: 1.0.0
description: Companion for the Hermux Android app — phone notifications when a reply finishes or Hermes needs you (works while the app is closed), plus a memory API for the app's Memory screen. Also cards in replies (OpenUI prompt section and the hermes-mobile openui skill).
author: omarqaterge
provides_hooks:
  - on_stream_start
  - on_stream_end
  - pre_tool_call
  - post_tool_call
  - on_skill_lifecycle
  - subagent_start
  - pre_approval_request
  - on_session_end
  - api_request_error
