name: CI

# OpenUI's install script sends telemetry unless one of these is set.
env:
  OPENUI_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

on:
  push:
    branches: [main]
  pull_request:

# The token only reads (the code, a PR's file list and commits). The repository's default is read-only too; this keeps
# it so if that setting changes, and no step can push, comment or release with it.
permissions:
  contents: read
  pull-requests: read

# A newer push to a PR cancels its older run; every run on main finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every job: a time limit (a hung browser test or fetch would otherwise hold a runner for GitHub's default 6 hours) and
  # a checkout without the token saved in .git/config (no step uses git with it, so install scripts can't read it).

  # Which slow groups this change needs (tools/ci-changes.sh); main always runs everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.diff.outputs.web }}
      contract: ${{ steps.diff.outputs.contract }}
      patches: ${{ steps.diff.outputs.patches }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The repository's work is its owner's: no commit in a PR may credit an AI tool (tools/check-attribution.sh).
      # In this job, so the required "Web (...)" check fails with it.
      - name: No AI credit in the PR's commits
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --jq '.[] | [.sha, .commit.author.name, .commit.author.email, .commit.committer.name, .commit.committer.email, (.commit.message | gsub("\\n"; "\\\\n") | gsub("\t"; " "))] | join("\t")' |
            tools/check-attribution.sh --stdin
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR" ] && files=$(gh pr diff "$PR" --name-only --repo "$GITHUB_REPOSITORY"); then
            printf '%s\n' "$files" | tools/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          else
            echo all | tools/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          fi

  web-unit:
    name: Web typecheck and unit tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web

  # Five shards in parallel, each with its own mock and page; each starts at a check file that needs nothing from
  # earlier files (docs/spec/07-03-browser-e2e.md). Change the list there and here together. 12 is the longest file
  # (about 85 s in CI), so it runs alone; 18 runs only after 17, which it needs. `19-` is 19 to the last file, so a new
  # file at the end runs without a change here.
  web-e2e:
    name: Web build and browser e2e (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ['01-06', '07-11', '12', '13-16,19-', '17-18']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tools/web-e2e/package-lock.json
      - run: npm ci
        working-directory: web
      # The typecheck runs in web-unit; here only the bundle the browser tests load.
      - run: npx vite build
        working-directory: web
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tools/web-e2e/package-lock.json') }}
      - name: Browser e2e against the mock Hermes
        working-directory: tools/web-e2e
        env:
          HM_E2E_SKIP_BUILD: '1'
        # No --with-deps: the runner image already has Chromium's system libraries (it ships Google Chrome), and the
        # apt-get run that flag starts cost about 20 s per shard even with the browser cached.
        run: |
          npm ci
          npx playwright install chromium
          ./run.sh --only ${{ matrix.shard }}

  # The name the main ruleset requires: passes when both web jobs passed, or were skipped because nothing web changed.
  web:
    name: Web (typecheck, unit tests, build, browser e2e)
    needs: [changes, web-unit, web-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.web-unit.result }} ${{ needs.web-e2e.result }}
        run: |
          echo "changes, web-unit, web-e2e: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac

  plugin:
    name: Plugin (canvas + media)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install fastapi httpx
      - run: python3 tools/test_check_spec.py
      - run: python3 tools/check_spec.py
      - run: python3 tools/test_changelog.py
      - run: python3 tools/changelog.py check
      - run: python3 tools/test_canvas.py
      - run: python3 tools/test_library.py
      - run: python3 tools/test_gallery.py
      - run: python3 tools/test_media.py
      - run: python3 tools/test_chat_search.py
      - run: python3 tools/test_checkpoints.py
      - run: python3 tools/test_battery.py
      - run: python3 tools/test_approval.py
      - run: python3 tools/test_chip.py
      - run: python3 tools/test_phone_app.py
      - run: python3 tools/test_auto_mode.py
      - run: python3 tools/test_openui.py
      - run: python3 tools/test_openui_query.py
      - run: python3 tools/test_claude_login.py
      - run: python3 tools/test_phone_access.py
      - run: python3 tools/test_profile_link.py

  # Required by the main ruleset; a job skipped by its `if` counts as passed there.
  hermes-patches:
    name: Hermes patches apply to the pinned Hermes
    needs: changes
    if: needs.changes.outputs.patches == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: tools/test_hermes_patches.sh
      - run: bash tools/test_hermes_debian.sh
      - run: bash tools/test_bootstrap_pin.sh
      - run: bash tools/test_bootstrap_image.sh
      - run: bash tools/test_say_hook.sh
      - run: bash tools/test_install_routes.sh
      - run: bash tools/test_uninstall.sh
      - run: bash tools/test_hm_shizuku.sh
      - run: bash tools/test_device_lock.sh
      - run: bash tools/test_ci_changes.sh

  android:
    name: Android Java compiles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v5
        with:
          path: ~/.cache/hermes-mobile
          key: android-all-16-sherpa-onnx-2.0.1 # bump with VERSION in tools/sherpa-onnx.sh
      - run: tools/java-check.sh
      - run: tools/api-check.sh
      - run: tools/test_setup_lines.sh
      - run: tools/test_autostart.sh
      - run: tools/test_devtools_guard.sh

  hermes-contract:
    name: Mock Hermes matches the pinned Hermes
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/web-e2e/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: web/vendor/hermes-shared/.hermes-commit
      - name: Install the mock's packages
        working-directory: tools/web-e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci
      - run: tools/hermes-contract/run.sh "$RUNNER_TEMP/hermes-contract"
