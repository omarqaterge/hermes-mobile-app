name: Release

# Push a tag like v0.8.0 and this builds the APK and attaches it to a GitHub release,
# which phone/install.sh downloads. Needs the repo secret KEYSTORE_B64 (base64 of the signing keystore):
# every release must be signed with the same key, or phones can't update.
# OpenUI's install script sends telemetry unless one of these is set.
env:
  OPENUI_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

on:
  push:
    tags: ['v*']

# Two jobs, so that no npm package's code ever runs where the signing key is: `web` installs the packages and builds
# web/dist/index.html with a read-only token and no secrets; `apk` (no Node, no npm) takes that file, signs the APK
# and publishes it. A package's install script or build plugin can start a process that outlives its step, but not
# one that reaches another job's runner.
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx vite build
        working-directory: web
        env:
          HERMES_STATS_KEY: ${{ vars.APTABASE_APP_KEY }} # not a secret: it ships in the app; empty = no stats
          HERMES_REPORT_URL: ${{ vars.REPORT_RELAY_URL }} # not a secret either; empty = reports open GitHub's page
      - uses: actions/upload-artifact@v6
        with:
          name: web-dist
          path: web/dist/index.html
          retention-days: 1
          if-no-files-found: error

  apk:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # The token (contents: write) is not saved in .git/config; the publish step passes it to gh itself.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: web/dist
      - name: Android SDK pieces
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null
      - name: Build the APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "Set the KEYSTORE_B64 secret first"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          v="${GITHUB_REF_NAME#v}"; IFS=. read -r a b c <<< "$v"
          HM_SKIP_WEB_BUILD=1 KEYSTORE="$RUNNER_TEMP/release.keystore" VERSION_NAME="$v" \
            VERSION_CODE=$(( a * 10000 + b * 100 + ${c:-0} )) android/build.sh
          rm -f "$RUNNER_TEMP/release.keystore"
      # Two names, one file: hermux.apk for new downloads, hermes-mobile.apk for old scripts and links. Installed apps
      # take any .apk of the latest release.
      - name: Copy the APK to its second name
        run: cp android/build/hermes-mobile.apk android/build/hermux.apk
      - name: Release APKs must not carry the test-build flag
        run: |
          for apk in android/build/hermes-mobile.apk android/build/hermux.apk; do
            [ -s "$apk" ] || { echo "$apk is missing"; exit 1; }
            if unzip -p "$apk" resources.arsc | grep -aq hm_devtools; then
              echo "$apk has hm_devtools (WebView remote debugging)"; exit 1
            fi
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made on GitHub's website (Releases -> Draft a new release) creates the tag and the release together:
        # then this only attaches the APK files to it.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" android/build/hermes-mobile.apk android/build/hermux.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" android/build/hermes-mobile.apk android/build/hermux.apk \
              --title "Hermux $GITHUB_REF_NAME" \
              --notes "Install: run the one-line installer from the README in Termux, or download hermux.apk below on your phone (hermes-mobile.apk is the same file under its old name). Setup steps: https://github.com/${{ github.repository }}#install"
          fi
