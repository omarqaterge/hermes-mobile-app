name: Release

# Push a tag like v0.8.0 and this builds the APK and attaches it to a GitHub release,
# which phone/install.sh downloads. Needs the repo secret KEYSTORE_B64 (base64 of the signing keystore):
# every release must be signed with the same key, or phones can't update. KEYSTORE_PASS holds its password (until it
# is set, android/build.sh warns and uses the old public default).
# OpenUI's install script sends telemetry unless one of these is set.
env:
  OPENUI_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

on:
  push:
    tags: ['v*']

# First `gate` (tools/release-gate.sh): the tagged commit must be on main with a passing CI run, or nothing is built.
# Then two jobs, so that no npm package's code ever runs where the signing key is: `web` installs the packages and builds
# web/dist/index.html with a read-only token and no secrets; `apk` (no Node, no npm) takes that file, signs the APK
# and publishes it. A package's install script or build plugin can start a process that outlives its step, but not
# one that reaches another job's runner.
permissions:
  contents: read

jobs:
  # Waits up to 20 minutes for the commit's CI run when the tag was pushed right after the merge.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release-gate.sh

  web:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx vite build
        working-directory: web
        env:
          HERMES_STATS_KEY: ${{ vars.APTABASE_APP_KEY }} # not a secret: it ships in the app; empty = no stats
          HERMES_REPORT_URL: ${{ vars.REPORT_RELAY_URL }} # not a secret either; empty = reports open GitHub's page
      - uses: actions/upload-artifact@v6
        with:
          name: web-dist
          path: web/dist/index.html
          retention-days: 1
          if-no-files-found: error

  apk:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token and attestations: write only for the build provenance attestation of hermux.apk.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The token (contents: write) is not saved in .git/config; the publish step passes it to gh itself.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: web/dist
      - name: Android SDK pieces
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null
      - name: Build the APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }} # empty until set: build.sh warns and uses the old default
          KEYSTORE_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }} # empty: the same as KEYSTORE_PASS
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "Set the KEYSTORE_B64 secret first"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          v="${GITHUB_REF_NAME#v}"
          code=$(tools/version-code.sh "$v")  # a*1000000 + b*1000 + c; fails for a version it can't number
          HM_SKIP_WEB_BUILD=1 KEYSTORE="$RUNNER_TEMP/release.keystore" VERSION_NAME="$v" \
            VERSION_CODE="$code" android/build.sh
          rm -f "$RUNNER_TEMP/release.keystore"
      # One file, one name: hermux.apk. (Releases up to v0.9.7 also carried it as hermes-mobile.apk, for old scripts and
      # links.) Installed apps take any .apk of the latest release; the installers ask for hermux.apk first.
      - name: Name the APK hermux.apk
        run: mv android/build/hermes-mobile.apk android/build/hermux.apk
      - name: Release APKs must not carry the test-build flag
        run: |
          for apk in android/build/hermux.apk; do
            [ -s "$apk" ] || { echo "$apk is missing"; exit 1; }
            if unzip -p "$apk" resources.arsc | grep -aq hm_devtools; then
              echo "$apk has hm_devtools (WebView remote debugging)"; exit 1
            fi
          done
      # Proof the download is the real one (docs/decisions/release-integrity.md): a checksum file beside the APK, and a
      # build provenance attestation that `gh attestation verify hermux.apk -R <repo>` checks. The checksum only catches a
      # broken download; the attestation proves this workflow built the file from the tagged commit.
      - name: Checksum of the APK
        working-directory: android/build
        run: sha256sum hermux.apk > hermux.apk.sha256 && cat hermux.apk.sha256
      - name: Attest the APK (build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: android/build/hermux.apk
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # A release made on GitHub's website (Releases -> Draft a new release) creates the tag and the release together:
        # then this attaches the files to it and adds the check lines to its notes.
        run: |
          sha=$(cut -d' ' -f1 android/build/hermux.apk.sha256)
          check="Check the download: SHA-256 of hermux.apk is \`$sha\` (also in hermux.apk.sha256). Proof it was built by this repository's release workflow from this tag: \`gh attestation verify hermux.apk -R $REPO\`. The signing certificate's SHA-256 fingerprint is in the README (Install)."
          # What changed: this tag's section of CHANGELOG.md, first on the page (nothing when the tag has none).
          news=$(python3 tools/changelog.py page "$GITHUB_REF_NAME")
          if [ -n "$news" ]; then news="## What's new"$'\n\n'"$news"$'\n\n---\n\n'; fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" android/build/hermux.apk android/build/hermux.apk.sha256 --clobber
            body=$(gh release view "$GITHUB_REF_NAME" --json body -q .body)
            case "$body" in *"$sha"*) ;; *) body="$body"$'\n\n'"$check" ;; esac
            case "$body" in *"## What's new"*) ;; *) body="$news$body" ;; esac
            gh release edit "$GITHUB_REF_NAME" --notes "$body"
          else
            gh release create "$GITHUB_REF_NAME" android/build/hermux.apk android/build/hermux.apk.sha256 \
              --title "Hermux $GITHUB_REF_NAME" \
              --notes "$news""Install: run the one-line installer from the README in Termux, or download hermux.apk below on your phone. Setup steps: https://github.com/$REPO#install"$'\n\n'"$check"
          fi
